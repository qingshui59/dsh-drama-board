<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>映序 Studio · AI 短剧工作台</title>
<style>html,body,#app{height:100%;margin:0}body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;background:#f3f5f9}</style>
</head>
<body>
<div id="app"></div>
<script src="vendor/react.js"></script>
<script src="vendor/react-dom.js"></script>
<script>
// 独立运行时模拟 Harness 的模块加载器：接口全部走同源的 /drama-board/api（见 server.mjs）。
window.__ModuleLoader__ = {
  load({ factory }) {
    const plugin = factory((name) => (name === 'react' ? React : null))
    plugin.apply({
      effect(fn) { fn() },
      locale: { register() {}, bind() { return (key) => key } },
      slots: {
        inject(name, fn) { fn() },
        register(meta, Component) {
          if (meta.name === 'main') ReactDOM.createRoot(document.getElementById('app')).render(React.createElement(Component))
        },
      },
    })
  },
}
</script>
<script src="../client.js"></script>
</body>
</html>
